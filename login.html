<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="login-section">

        <div class="container">

            <div class="row align-items-center justify-content-center">

                <div class="col-lg-6 d-none d-lg-flex">

                    <div class="left-panel">

                        <div class="brand-box">

                            <div class="brand-icon">

                                <i class="bi bi-heart-pulse-fill"></i>

                            </div>

                            <h1>BloodLink</h1>

                            <h5>Share Life, Give Blood</h5>

                            <p>

                                Every drop of blood can save a life.

                                Join our donor community and make

                                a difference today.

                            </p>

                            <div class="info-card">

                                <i class="bi bi-droplet-half"></i>

                                <span>

                                    One Donation Can Save Up To 3 Lives

                                </span>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="col-lg-5 col-md-8">

                    <div class="login-card">

                        <div class="text-center mb-4">

                            <div class="logo-circle">

                                <i class="bi bi-droplet-fill"></i>

                            </div>

                            <h2>Welcome Back</h2>

                            <p class="subtitle">

                                Login to your BloodLink account

                            </p>

                        </div>

                        <form>

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <div class="input-group custom-input">

                                    <span class="input-group-text">

                                        <i class="bi bi-envelope-fill"></i>

                                    </span>

                                    <input type="email" class="form-control" placeholder="Enter your email">

                                </div>

                            </div>

                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <div class="input-group custom-input">

                                    <span class="input-group-text">

                                        <i class="bi bi-lock-fill"></i>

                                    </span>

                                    <input type="password" id="password" class="form-control"
                                        placeholder="Enter your password">

                                    <button class="btn bg-white" type="button" onclick="togglePassword()">

                                        <i id="eye" class="bi bi-eye-fill"></i>

                                    </button>

                                </div>

                            </div>

                            <div class="d-flex justify-content-between mb-4">

                                <div>

                                    <input type="checkbox">

                                    Remember Me

                                </div>

                                <a href="#">

                                    Forgot Password?

                                </a>

                            </div>

                            <button type="submit" class="btn login-btn w-100">

                                Login

                            </button>

                            <div class="text-center mt-4">

                                Don't have an account?

                                <a href="registration.html">

                                    Register Now

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="login.js"></script>

</body>

</html>
